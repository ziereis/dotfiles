## Vesper — derived from the real palette
##   upstream:  raunofreiberg/vesper (VS Code)
##   nvim port: datsfilipe/vesper.nvim  (lua/vesper/colors.lua)
##
## Vesper only has five hues: mint, peach, red, slate, gray.
## Normal colors  = the nvim port's dimmed values (what you see in buffers).
## Bright colors  = the upstream un-dimmed values where they exist.

#: The basic colors

foreground                      #CCCCCC
background                      #101010
selection_foreground            #FFFFFF
selection_background            #656565


#: Cursor colors
#: (nvim: Cursor = { fg = bg, bg = fg })

cursor                          #CCCCCC
cursor_text_color               #101010
cursor_trail_color              none


#: URL underline color when hovering with mouse

url_color                       #FFC799


#: kitty window border colors and terminal bell colors

active_border_color             #65737E
inactive_border_color           #343434
bell_border_color               #FFC799
visual_bell_color               none


#: OS Window titlebar colors

wayland_titlebar_color          system
macos_titlebar_color            system


#: Tab bar colors

active_tab_foreground           #101010
active_tab_background           #CCCCCC
inactive_tab_foreground         #A0A0A0
inactive_tab_background         #101010
tab_bar_background              none
tab_bar_margin_color            none


#: Colors for marks (marked text in the terminal)

mark1_foreground #101010
mark1_background #99FFE4
mark2_foreground #101010
mark2_background #FFC799
mark3_foreground #101010
mark3_background #FF8080


#: The basic 16 colors

#: black  (bgOption / lifted comment gray — Vesper primary)
color0  #343434
color8  #A0A0A0

#: red  (error, Invalid, Deleted)
color1  #FF8080
color9  #FF9999

#: green  (String)
color2  #82D9C2
color10 #99FFE4

#: yellow  (Function, Number, Tag)
color3  #FFC799
color11 #FFCFA8

#: blue  (Vesper slate, HSL-lifted for terminal legibility)
color4  #8FA0AD
color12 #A8B5BF

#: magenta  (palette "purple" — peach in Vesper)
color5  #FFCFA8
color13 #FFD9B9

#: cyan  (info)
color6  #99FFE4
color14 #ADFFE9

#: white  (fg / Constant)
color7  #CCCCCC
color15 #FFFFFF


#: Extended palette overrides
#:
#: Pure hardcodes 256-cube index 242 (#6C6C6C, 3.6:1 on #101010) for
#: user, host, git:branch, virtualenv and the continuation prompt.
#: Those are outside color0-15 so the base palette can't reach them.
#: Lift to Vesper's `primary` so the whole dim tier sits at ~7:1.

color242 #A0A0A0
color243 #A8A8A8
color244 #B0B0B0

#: git:dirty (218) and Pure's error/success magenta -> keep on-palette
color218 #FFCFA8
