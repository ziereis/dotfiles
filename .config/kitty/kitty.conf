map cmd+shift+t launch --cwd=current --type=tab
map cmd+enter split_vertical
background_opacity 1.0
background_image_layout scaled
dynamic_background_opacity no
background_tint 1.0
shell /bin/zsh --login --interactive
clipboard_control write-clipboard write-primary read-clipboard read-primary-ask
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
include current-theme.conf
