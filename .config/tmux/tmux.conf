set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g default-shell /bin/zsh
set -g default-command /bin/zsh

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g set-clipboard on
set -g extended-keys always
set -as terminal-features ',xterm-kitty:clipboard:extkeys'

set -g mouse on

bind -n S-Left  previous-window
bind -n S-Right next-window

# Colors follow the Vesper palette, shared with the Neovim colorscheme
# (datsfilipe/vesper.nvim) and ../kitty/vesper.conf. The bar sits on #161616
# rather than the #101010 editor background so it reads as chrome.
set -g status-style 'fg=#a0a0a0,bg=#161616'
set -g status-left  ' #[fg=#ffc799,bold]#S #[fg=#505050]│ '
set -g status-right '#[fg=#505050]│ #[fg=#ffc799]%H:%M '
set -g status-left-length 40

set -g window-status-format         ' #I  #W '
set -g window-status-current-format ' #I  #W '
set -g window-status-style          'fg=#a0a0a0,bg=default'
set -g window-status-current-style  'fg=#101010,bg=#ffc799,bold'
set -g window-status-activity-style 'fg=#ff8080,bg=default'
set -g window-status-separator      ''

set -g pane-border-style        'fg=#343434'
set -g pane-active-border-style 'fg=#ffc799'

set -g message-style 'fg=#101010,bg=#ffc799'

run '~/.config/tmux/plugins/tpm/tpm'
