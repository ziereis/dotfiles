set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g default-shell /bin/zsh
set -g default-command /bin/zsh

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g set-clipboard on
set -g extended-keys always
set -as terminal-features ',xterm-kitty:clipboard:extkeys'

set -g mouse on

bind -n S-Left  previous-window
bind -n S-Right next-window

# Colors follow the Neovim One Light palette (navarasu/onedark, light style).
set -g status-style 'fg=#383a42,bg=#e6e6e6'
set -g status-left  ' #[fg=#4078f2,bold]#S #[fg=#a0a1a7]│ '
set -g status-right '#[fg=#a0a1a7]│ #[fg=#4078f2]%H:%M '
set -g status-left-length 40

set -g window-status-format         ' #I  #W '
set -g window-status-current-format ' #I  #W '
set -g window-status-style          'fg=#a0a1a7,bg=default'
set -g window-status-current-style  'fg=#fafafa,bg=#4078f2,bold'
set -g window-status-activity-style 'fg=#e45649,bg=default'
set -g window-status-separator      ''

set -g pane-border-style        'fg=#dcdcdc'
set -g pane-active-border-style 'fg=#4078f2'

set -g message-style 'fg=#fafafa,bg=#4078f2'

run '~/.config/tmux/plugins/tpm/tpm'
