set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

set -g default-shell /bin/zsh
set -g default-command /bin/zsh

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g set-clipboard on
set -g extended-keys always
set -as terminal-features ',xterm-kitty:clipboard:extkeys'

set -g mouse on

bind -n S-Left  previous-window
bind -n S-Right next-window

# Colors follow the Neovim One Dark palette (navarasu/onedark, dark style).
set -g status-style 'fg=#abb2bf,bg=#31353f'
set -g status-left  ' #[fg=#61afef,bold]#S #[fg=#5c6370]│ '
set -g status-right '#[fg=#5c6370]│ #[fg=#61afef]%H:%M '
set -g status-left-length 40

set -g window-status-format         ' #I  #W '
set -g window-status-current-format ' #I  #W '
set -g window-status-style          'fg=#848b98,bg=default'
set -g window-status-current-style  'fg=#282c34,bg=#61afef,bold'
set -g window-status-activity-style 'fg=#e86671,bg=default'
set -g window-status-separator      ''

set -g pane-border-style        'fg=#3b3f4c'
set -g pane-active-border-style 'fg=#61afef'

set -g message-style 'fg=#282c34,bg=#61afef'

run '~/.config/tmux/plugins/tpm/tpm'
